<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="felt" cx="50%" cy="28%" r="85%">
      <stop offset="0" stop-color="#1b5c48"/>
      <stop offset="1" stop-color="#072219"/>
    </radialGradient>
    <linearGradient id="stock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffcf4"/>
      <stop offset="1" stop-color="#e6ddc8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#felt)"/>
  <circle cx="256" cy="262" r="196" fill="none" stroke="#c9a45c" stroke-opacity="0.45" stroke-width="4"/>
  <g filter="url(#shadow)">
    <!-- ace of spades -->
    <g transform="rotate(-12 256 280)">
      <rect x="128" y="138" width="156" height="220" rx="16" fill="url(#stock)"/>
      <text x="146" y="192" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#18160f">A</text>
      <path transform="translate(206 262) scale(1.45)" fill="#18160f"
        d="M0,-38 C14,-22 34,-12 34,6 C34,20 22,28 11,26 C6,25 3,22 2,19 C3,28 6,34 12,38 L-12,38 C-6,34 -3,28 -2,19 C-3,22 -6,25 -11,26 C-22,28 -34,20 -34,6 C-34,-12 -14,-22 0,-38 Z"/>
    </g>
    <!-- king of hearts -->
    <g transform="rotate(10 256 280)">
      <rect x="224" y="138" width="156" height="220" rx="16" fill="url(#stock)"/>
      <text x="242" y="192" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#962a2a">K</text>
      <path transform="translate(302 266) scale(1.45)" fill="#962a2a"
        d="M0,34 C-18,18 -36,4 -36,-12 C-36,-26 -25,-34 -15,-34 C-7,-34 -2,-29 0,-24 C2,-29 7,-34 15,-34 C25,-34 36,-26 36,-12 C36,4 18,18 0,34 Z"/>
    </g>
    <!-- dealer button -->
    <circle cx="356" cy="372" r="50" fill="#f6f0e2" stroke="#c9a45c" stroke-width="5"/>
    <circle cx="356" cy="372" r="39" fill="none" stroke="#18160f" stroke-opacity="0.25" stroke-width="2"/>
    <text x="356" y="388" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#18160f">D</text>
  </g>
</svg>
